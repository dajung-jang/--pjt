<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre (Grid)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .genre-books {
        width: 80%;
        margin: 0 auto;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      /* [F310] CSS Grid 컨테이너: 5열 x 4행, 아이템마다 다른 크기 */
      .genre-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-auto-rows: 140px;
        gap: 10px;
        max-width: 900px;
        margin: 0 auto;
        grid-template-areas:
          "travel     travel     health  art     art"
          "travel     travel     health  history history"
          "romance    philosophy health  baby    youth"
          "romance    philosophy science economy economy";
      }
      .genre-item {
        position: relative;
        overflow: hidden;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .genre-item.travel { grid-area: travel; }
      .genre-item.health { grid-area: health; }
      .genre-item.art { grid-area: art; }
      .genre-item.history { grid-area: history; }
      .genre-item.economy { grid-area: economy; }
      .genre-item.philosophy { grid-area: philosophy; }
      .genre-item.natural_science { grid-area: science; }
      .genre-item.baby { grid-area: baby; }
      .genre-item.youth { grid-area: youth; }
      .genre-item.romance { grid-area: romance; }

      /* 이미지는 부모 요소 크기에 맞게 채움 */
      .genre-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .genre-item:hover img {
        transform: scale(1.05);
      }
      /* 좌측 하단 장르명 오버레이 */
      .genre-name {
        position: absolute;
        left: 0.75rem;
        bottom: 0.5rem;
        color: #fff;
        font-family: "SBAggro_L";
        font-size: 1rem;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }

      /* 태블릿: 3열로 재배치 */
      @media (max-width: 767.98px) {
        .genre-grid {
          grid-template-columns: repeat(3, 1fr);
          grid-auto-rows: 130px;
          grid-template-areas:
            "travel  travel     health"
            "travel  travel     health"
            "art     art        history"
            "romance philosophy science"
            "romance philosophy baby"
            "economy economy    youth";
        }
      }

      /* 모바일 (576px 미만): 1열 배치, 아이템마다 높이를 다르게 */
      @media (max-width: 575.98px) {
        .genre-grid {
          grid-template-columns: 1fr;
          grid-template-areas: none;
          grid-auto-rows: 120px;
        }
        .genre-item {
          grid-area: auto !important;
          grid-row: span 2;
        }
        .genre-item.travel,
        .genre-item.health,
        .genre-item.romance {
          grid-row: span 3;
        }
      }
    </style>
  </head>
  <body>
    <section class="genre-books py-5">
      <h3 class="section-title text-center mb-4">장르별 도서 목록</h3>
      <!-- 
        [F310 심화] 04-genre_list.html 을 확장하여 CSS Grid 로
        장르 아이템의 위치와 크기를 다양하게 배치
      -->
      <div class="genre-grid">
        <div class="genre-item travel">
          <img src="assets/genre/travel.jpg" alt="여행" />
          <span class="genre-name">여행</span>
        </div>
        <div class="genre-item health">
          <img src="assets/genre/health.jpg" alt="건강" />
          <span class="genre-name">건강</span>
        </div>
        <div class="genre-item art">
          <img src="assets/genre/art.jpg" alt="예술" />
          <span class="genre-name">예술</span>
        </div>
        <div class="genre-item history">
          <img src="assets/genre/history.jpg" alt="역사" />
          <span class="genre-name">역사</span>
        </div>
        <div class="genre-item economy">
          <img src="assets/genre/economy.jpg" alt="경제" />
          <span class="genre-name">경제</span>
        </div>
        <div class="genre-item philosophy">
          <img src="assets/genre/philosophy.jpg" alt="철학" />
          <span class="genre-name">철학</span>
        </div>
        <div class="genre-item natural_science">
          <img src="assets/genre/natural_science.jpg" alt="자연과학" />
          <span class="genre-name">자연과학</span>
        </div>
        <div class="genre-item baby">
          <img src="assets/genre/baby.jpg" alt="육아" />
          <span class="genre-name">육아</span>
        </div>
        <div class="genre-item youth">
          <img src="assets/genre/youth.jpg" alt="청소년" />
          <span class="genre-name">청소년</span>
        </div>
        <div class="genre-item romance">
          <img src="assets/genre/romance.jpg" alt="로맨스" />
          <span class="genre-name">로맨스</span>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
