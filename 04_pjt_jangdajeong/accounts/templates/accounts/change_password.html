{% extends "base.html" %}

{% block content %}
<h1>비밀번호 변경</h1>
<form action="{% url "accounts:change_password" %}" method="POST">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      {{field.label_tag}}
      {{field}}
      {% comment %} 비밀번호 규칙 안내 {% endcomment %}
      {{field.help_text}} 
      {{field.errors}}
    </div>
  {% endfor %}
    <button class="btn btn-primary" type="submit">변경</button>
</form>

{% endblock content %}
