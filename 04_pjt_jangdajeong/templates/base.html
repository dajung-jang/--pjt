<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Book App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class = "navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a href="{% url "books:index" %}" class="navbar-brand fw-bold">ThRead</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class='navbar-toggler-icon'></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a href="{% url "books:create" %}" class="nav-link">CREATE</a>
            </li>
            <li class="nav-item">
              <a href="{% url "accounts:update" %}" class="nav-link">MY PAGE</a>
            </li>
            <li class="nav-item">
              <form action="{% url "accounts:logout" %}" method="POST" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link">LOGOUT</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item">
              <a href="{% url "accounts:login" %}" class="nav-link">LOGIN</a>
            </li>
            <li class="nav-item">
              <a href="{% url "accounts:signup" %}" class="nav-link">SIGNUP</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <div class='container mt-5'>
    {% block content %}
    {% endblock content %}
  </div>
  {% comment %} 부트스트랩 {% endcomment %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
