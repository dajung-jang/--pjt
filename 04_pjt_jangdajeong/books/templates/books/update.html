{% extends 'base.html' %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card">
          <div class="card-body p-4 p-md-5">
            <h2 class="text-center mb-4">도서 수정</h2>
            <form action="{% url 'books:update' book.pk %}" method="POST">
              {% csrf_token %}
              {% for field in form %}
                <div class="mb-3">
                  {{ field.label_tag }}
                  {{ field }}
                  {{ field.errors }}
                </div>
              {% endfor %}
              <button type="submit" class="btn btn-primary w-100 mt-3">제출</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
