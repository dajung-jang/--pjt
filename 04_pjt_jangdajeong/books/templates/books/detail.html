{% extends "base.html" %}
{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="card">
          <div class="card-body p-4 p-md-5">
            <p class="text-muted mb-1">{{ book.author }}</p>
            <h1 class="mb-3">{{ book.title }}</h1>
            <p class="rank fs-5">★ {{ book.customer_review_rank }} / 10</p>
            <hr>
            <p style="white-space: pre-line;">{{ book.description }}</p>
          </div>
        </div>

        {# 심화 F417: 작가 정보 카드는 여기에 추가 #}

        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="{% url 'books:index' %}" class="btn btn-outline-dark rounded-pill">← BACK</a>

          {% if user.is_authenticated %}
            <div class="d-flex gap-2">
              <a href="{% url 'books:update' book.pk %}" class="btn btn-secondary rounded-pill">UPDATE</a>
              <form action="{% url 'books:delete' book.pk %}" method="POST"
                    onsubmit="return confirm('정말 삭제하시겠어요?')">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill">DELETE</button>
              </form>
            </div>
          {% endif %}
        </div>

      </div>
    </div>
  </div>
{% endblock content %}
